      // Apply the saved theme (星光 + 无衬线 by default) before first paint.
      (function () {
        var t = "starlight";
        var f = "sans";
        try {
          var s = JSON.parse(localStorage.getItem("word-atlas:settings") || "{}");
          if (s.theme) t = s.theme;
          if (s.wordFont === "serif" || s.wordFont === "sans" || s.wordFont === "classic") f = s.wordFont;
        } catch (e) {}
        document.documentElement.setAttribute("data-font", f);
        var skin = t === "aurora" || t === "starlight";
        if (skin) document.documentElement.setAttribute("data-skin", t);
        if (t !== "system") document.documentElement.setAttribute("data-theme", skin ? "dark" : t);
      })();
    </script>
