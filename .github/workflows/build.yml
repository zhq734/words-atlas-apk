name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release and debug APK
        run: ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace

      - name: Read version name
        id: version
        run: |
          VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APKs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp app/build/outputs/apk/release/app-release.apk "word-atlas-v${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "word-atlas-v${VERSION}-debug.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: word-atlas-apk
          path: word-atlas-v*.apk
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: word-atlas-apk
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "词光 Word Atlas ${GITHUB_REF_NAME}" \
            --notes "词光 Word Atlas ${GITHUB_REF_NAME} 由 GitHub Actions 自动构建，release 包使用 debug 签名，可直接安装。"
